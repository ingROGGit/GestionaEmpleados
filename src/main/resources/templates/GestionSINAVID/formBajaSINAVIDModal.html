<style>
	/* Opcional: Elimina los márgenes predeterminados del body para un verdadero ancho completo */
	body {
		margin: 0;
		padding: 0;
		font-family: sans-serif;
	}

	form {
		width: 100%;
		box-sizing: border-box;
		/* Asegura que el padding y el border se incluyan en el 100% */
		padding: 20px;
		/* Ejemplo de padding */
		border: 1px solid #ccc;
		/* Ejemplo de borde */
		background-color: #f9f9f9;
		/* Puedes añadir un max-width si no quieres que sea demasiado ancho en pantallas muy grandes */
		/* max-width: 1200px; */
		margin: 0 auto;
		/* Centra el formulario si usas max-width */
	}

	input[type="text"],
	input[type="submit"] {
		width: 100%;
		box-sizing: border-box;
		padding: 10px;
		margin-bottom: 10px;
	}
</style>
<div class="card bg-light">
	<div class="card-header" th:text="${titulo}">
	</div>
	<div class="card-body">
		<div class="row">
			<form th:action="@{/GestionSINAVID/formBajaSINAVID}" th:object="${sinavid}" method="post">
				<input type="hidden" th:field="*{id}" th:value="${sinavid.id}" />
				<div class="row">

					<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
						Empleado: <li class="list-group-item"
							th:text="${sinavid.empleado.id} +' '+${sinavid.empleado.nombreCompleto}"></li>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
						<label>Tipo Baja: </label>
						<select class="form-control" th:field="*{idBaja}">
							<option th:value='10'>10|Licencia sin goce de sueldo por asuntos</option>
							<option th:value='11'>11|Licencia sin goce de sueldo por comision</option>
							<option th:value='12'>12|Licencia sin goce de sueldo por suspension</option>
							<option th:value='20'>20|Defuncion</option>
							<option th:value='30'>30|Recision de contrato</option>
							<option th:value='40'>40|Pension o Jubilacion</option>
							<option th:value='50'>50|Renuncia</option>
							<option th:value='60'>60|Retiro Voluntario</option>
							<option th:value='70'>70|Otros</option>
						</select>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
						<div class="form-group">
                            <label for="reservationdate">Fecha de Baja:</label>
                            <div class="input-group date" id="reservationdate" data-target-input="nearest">
                                <input type="date" 
                                       th:field="*{fechaBaja}" 
                                       class="form-control" 
                                       data-target="#reservationdate"
                                       placeholder="Seleccione una fecha"/>
                            </div>
                        </div>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
						<h4></h4>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
						<h4>
							<p></p>
						</h4>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
					</div>
					<div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
						<div class="box-footer">
							<input type="submit" value="Guardar" class="btn btn-primary">
						</div>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
					</div>
				</div>
			</form>
		</div>
	</div><!-- /.container-fluid -->
</div>
<div class="modal-footer">
	<button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
</div>
