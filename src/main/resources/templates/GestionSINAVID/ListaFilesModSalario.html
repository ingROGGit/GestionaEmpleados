<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en"> <!--begin::Head-->

<head th:replace="headAll :: html_head" />

<body th:replace="menu :: menuAll" onload="validaModal()" />
<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
	<!-- Content Header (Page header) -->
	<div th:replace="div-header :: divHeader" />
	<!-- /.content-header -->

	<!-- Main content -->
	<main class="app-main"> <!--begin::App Content Header-->
		<section class="content">
			<div class="container-fluid">
				<div class="py-4 ml-5 mr-5">
					<div class="carf bg-light">
						<div class="col-lg-12 col-md-12 col-sm-12 container justify-content-center card text-center">
							<a>
								<h2><span th:text="${titulo}"></span></h2>
							</a>
						</div>
						<div class="card-body col-lg-12 col-md-12 col-sm-12 col-xs-12">
							<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
							<h4 class="card-title" sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADORCUENTAS')">
								<a th:href="@{/WORK}" class="btn btn-secondary">Exportar a
									PDF</a>
								<a th:href="@{/WORK}" class="btn btn-secondary">Exportar a
									Excel</a>
								<a th:if="${fileExDownload}" th:href="@{/cuentasBancarias/FileExcel}"
									class="btn btn-success">Descargar Reporte</a>

								<h2>
									<input class="form-control" id="search" type="text" placeholder="Buscar..">Total
									Registros:<a class="btn btn-info" th:text="${registros}"></a>
								</h2>
							</h4>
							<div class="contenedor-tabla">
								<table id="EmTable" class="table table-striped">
									<!--							<table id="EmTable"	class="table table-striped table-bordered" style="width:100%">-->
									<thead>
										<tr>
											<th class="col-lg-5 col-md-5 col-sm-6 col-xs-12">Alta</th>
											<th class="col-lg-4 col-md-4 col-sm-6 col-xs-12">Fecha Alta</th>
											<th class="col-lg-3 col-md-3 col-sm-6 col-xs-12">Acciones</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="file : ${files}">
											<td class="col-lg-5 col-md-5 col-sm-5 col-xs-12" th:text="${file.alta}">
											</td>
											<td th:text="${file.fechaAlta}"></td>
											<td sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADORSINAVID')"
												class="col-lg-2 col-md-2 col-sm-2 col-xs-12">
												<!--												<a sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADORCUENTAS')"-->
												<!--													class="btn btn-warning btn-sm link-EmpleadoEdit"-->
												<!--													th:href="@{/cuentasBancarias/verFile/} + ${file.id}">Ver Archivo</a>-->
												<a sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADORSINAVID')"
													class="btn btn-warning btn-sm"
													th:href="@{/GestionSINAVID/downloadFileModSalario/} + ${file.id}">Descargar</a>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<nav th:replace="paginator-nav :: paginator"></nav>
						</div>
					</div>
					<div id="modalDetaills" class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog"
						aria-labelledby="myExtraLargeModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-xl" role="document">
							<div class="modal-content">
							</div>
						</div>
					</div>
				</div>

				<script>
					$(document).ready(function () {

						$("#search").keyup(function () {

							_this = this;
							$.each($("#EmTable tbody tr"), function () {

								if ($(this).text().toLowerCase().indexOf($(_this).val().toLowerCase()) === -1)

									$(this).hide();

								else

									$(this).show();

							});

						});

					});
					$(document).ready(function () {
						$(".link-detail").on("click", function (e) {
							e.preventDefault();
							$("#modalDetaills").modal("show").find(".modal-content").load($(this).attr("href"));
						});
					});
					$(document).ready(function () {
						$(".link-EmpleadoEdit").on("click", function (e) {
							e.preventDefault();
							$("#modalDetaills").modal("show").find(".modal-content").load($(this).attr("href"));
						});
					});
					$(document).ready(function () {
						$(".link-Download").on("click", function (e) {
							e.preventDefault();
							$("#modalDownload").modal("show").load($(this).attr("href"));
						});
					});
				</script>
				<style>
					.contenedor-tabla {
						height: 400px;
						/* Altura fija para el contenedor */
						overflow-y: auto;
						/* Barra de desplazamiento vertical si el contenido excede la altura */
						overflow-x: auto;
						/* Barra de desplazamiento horizontal si el contenido excede el ancho */
						border: 1px solid #ccc;
						/* Opcional: para visualizar el contenedor */
					}

					/* Para mantener el encabezado fijo */
					.contenedor-tabla table {
						width: 100%;
						/* O un ancho fijo para la tabla */
						border-collapse: collapse;
					}

					.contenedor-tabla thead {
						position: sticky;
						top: 0;
						background-color: #f2f2f2;
						/* Para que no se transparente */
						z-index: 1;
					}

					/* Estilos básicos para celdas (opcional) */
					.contenedor-tabla th,
					.contenedor-tabla td {
						border: 1px solid #ddd;
						padding: 8px;
						text-align: left;
					}
				</style>
				<footer th:replace="layout/layout :: footer"></footer>
			</div><!-- /.container-fluid -->
		</section>
		<!-- /.content -->
	</main> <!--end::App Main--> <!--begin::Footer-->

</div>
<!-- /.content-wrapper -->

</html>
