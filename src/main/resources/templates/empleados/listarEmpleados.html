<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en"> <!--begin::Head-->

<head th:replace="headAll :: html_head" />

<body th:replace="menu :: menuAll" />
<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
	<!-- Content Header (Page header) -->
	<div th:replace="div-header :: divHeader" />
	<!-- /.content-header -->

	<!-- Main content -->
	<main class="app-main"> <!--begin::App Content Header-->
		<section class="content">
			<div class="container-fluid">
				<div class="col-lg-12 col-md-12 col-sm-12 container justify-content-center card text-center">
					<a>
						<h2><span th:text="${titulo}"></span></h2>
					</a>
				</div>
				<div class="row">
					<div class="col-lg-12 col-md-12 col-sm-12 container justify-content-center card">
						<div th:if="${success !=null}">
							<div class="alert alert-primary alert-dismissible fade show" role="alert">
								<span aria-hidden="true">&times;</span>
								<button type="button" class="close" data-dismiss="alert" aria-label="Close">
									<span aria-hidden="true" th:text="${success}">&times;</span>
								</button>
							</div>
						</div>
						<div th:if="${error !=null}">
							<div class="col-md-100 col-sm-100 alert alert-warning alert-dismissible fade show"
								role="alert">
								<span aria-hidden="true">&times;</span>
								<button type="button" class="close" data-dismiss="alert" aria-label="Close">
									<span aria-hidden="true" th:text="${error}">&times;</span>
								</button>
							</div>
						</div>
					</div>
				</div>
				<div class="py-4 ml-5 mr-5">
					<div class="carf bg-light">
						<div class="card-body col-lg-12 col-md-12 col-sm-12 col-xs-12">
							<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
							<h4 class="card-title"
								sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ADMIN1')">
								<select class="form-control" id="quinCatSelectGet" name="quinCatSelectGet" onchange="actualizarEnlace()">
									<option value="">select QNA</option>
									<option th:each="qna : ${LquincenasCat}" th:value="${qna}" th:text="${qna}"
										th:selected="${qna == quinCatSelectGet}">
									</option>
								</select>
								<a th:href="@{/empleados/exportarPDF}" class="btn btn-secondary">Exportar a PDF</a>
								<a id="btnExportar" th:href="@{/empleados/exportarExcelThread(quinCatSelectGet=${quinCatSelectGet})}"
									class="btn btn-success link-Download">Exportar a
									Excel</a>
								<a th:if="${fileExDownload && filefull}" th:href="@{/empleados/FileExcel}"
									class="btn btn-success">Descargar Reporte</a>
							</h4>
							<h2>
								<input class="form-control" id="search" type="text" placeholder="Buscar..">Total
								Registros:<a class="btn btn-info" th:text="${registros}"></a>

							</h2>
							<div class="contenedor-tabla">
								<table id="EmTable" class="table table-striped">
									<!--							<table id="EmTable"	class="table table-striped table-bordered" style="width:100%">-->
									<thead>
										<tr>
											<th>Numero</th>
											<th>Nombre</th>
											<th>Apellidos</th>
											<th>CURP</th>
											<th>Telefono</th>
											<th class="col-lg-3 col-md-3 col-sm-6 col-xs-12">Fecha Ingreso</th>
											<th class="col-lg-3 col-md-3 col-sm-6 col-xs-12">Acciones</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="empleado : ${empleados}" th:style="${empleado.activo ==false} ? 'background-color: #ffcccc;' : ''">
											<td th:text="${empleado.id}"></td>
											<td th:text="${empleado.nombre}"></td>
											<td class="col-lg-3 col-md-3 col-sm-6 col-xs-12"
												th:text="${empleado.apellidop} +' '+${empleado.apellidom}"></td>
											<td th:text="${empleado.curp}"></td>
											<td th:text="${empleado.telefono}"></td>
											<td class="col-lg-3 col-md-3 col-sm-6 col-xs-12"
												th:text="${empleado.fechaIngreso}"></td>
											<td class="col-lg-4 col-md-4 col-sm-6 col-xs-12">
												<a class="btn btn-info btn-sm link-detail"
													th:href="@{/empleados/verDatosEmpleado/} + ${empleado.id}">Detalles</a>
												<a sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS','ROLE_OPERADOR1','ROLE_OPERADORSINAVID1','ROLE_OPERADORSINAVID')"
													class="btn btn-warning btn-sm link-EmpleadoEdit"
													th:href="@{/empleados/formEmpleadoEdit/} + ${empleado.id}">Editar</a>
												<a sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADORCUENTAS')"
													class="btn btn-warning btn-sm link-EmpleadoEdit"
													th:href="@{/cuentasBancarias/formCuenta/{id}(id=${empleado.id}, addNew=${addNew})}">Agregar
													Cuenta</a>
												<a th:if="${empleado.activo==true}" sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ADMIN1')"
													class="btn btn-danger btn-sm"
													th:href="@{/empleados/baja/} + ${empleado.id}"
													onclick="return confirm('Esta seguro de Baja el Empleado');">Baja</a>
												<th:block th:if="${empleado.sinavid!=null}">	
												<a th:if="${empleado.sinavid.estatus!='PARA BAJA'}"
													sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ADMIN1','ROLE_OPERADORSINAVID','ROLE_OPERADORSINAVID1')"
													class="btn btn-warning btn-sm"
													th:href="@{/empleados/bajaSINAVID/} + ${empleado.id}"
													onclick="return confirm('Esta seguro Baja de Empleado en SINAVID');">Para Baja
													SINAVID</a>
												<a th:if="${empleado.sinavid.estatus!='ALTA'}"
													sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ADMIN1','ROLE_OPERADORSINAVID','ROLE_OPERADORSINAVID1','ROLE_OPERADORCUENTAS')"
													class="btn btn-success btn-sm"
													th:href="@{/empleados/altaSINAVID/} + ${empleado.id}"
													onclick="return confirm('Esta seguro del Alta en SINAVID');">Marcar Alta</a>
													<a th:if="${empleado.sinavid.activo==true}"
													sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_ADMIN1','ROLE_OPERADORSINAVID','ROLE_OPERADORSINAVID1')"
													class="btn btn-danger btn-sm"
													th:href="@{/empleados/bajaDefSINAVID/} + ${empleado.id}"
													onclick="return confirm('Esta seguro de la Baja en SINAVID');">Baja Definitiva SINAVID</a>
<!--												<a sec:authorize="hasRole('ROLE_ADMIN')" class="btn btn-danger btn-sm"-->
<!--													th:href="@{/empleados/eliminar/} + ${empleado.id}"-->
<!--													onclick="return confirm('Esta seguro de Eliminar el Empleado');">Eliminar</a>-->
												</th:block>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<nav th:replace="paginator-nav :: paginator"></nav>
						</div>
					</div>
					<div id="modalDetaills" class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog"
						aria-labelledby="myExtraLargeModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-xl" role="document">
							<div class="modal-content">
							</div>
						</div>
					</div>
					<div id="modalDownload" class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog"
						aria-labelledby="myExtraLargeModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-xl" role="document">
							<div class="modal-content">
								<div class="modal-content">
									<div class="modal-header">
										<h5 class="modal-title" id="exampleModalLabel">Descarga de Reportes</h5>
										<button type="button" class="btn-close" data-bs-dismiss="modal"
											aria-label="Close"></button>
									</div>
									<div class="modal-body">
										<span aria-hidden="true">&times;</span>
										<button type="button" class="close" data-dismiss="alert" aria-label="Close">
											<span aria-hidden="true" th:text="${'El Reporte se esta ejecutando en segundo plano Favor de esperar unos minutos y
										dar clic en  Descargar Reporte'}">&times;</span>
										</button>

									</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary"
											data-dismiss="modal">Close</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<script>
					function actualizarEnlace() {
					    // 1. Obtener el valor seleccionado del select
					    const selectValue = document.getElementById('quinCatSelectGet').value;
					    
					    // 2. Obtener el elemento del enlace
					    const enlace = document.getElementById('btnExportar');
					    
					    // 3. Modificar el atributo href con el nuevo valor
					    enlace.href = `/empleados/exportarExcelThread?quinCatSelectGet=${encodeURIComponent(selectValue)}`;
					}
					$(document).ready(function () {

						$("#search").keyup(function () {

							_this = this;
							$.each($("#EmTable tbody tr"), function () {

								if ($(this).text().toLowerCase().indexOf($(_this).val().toLowerCase()) === -1)

									$(this).hide();

								else

									$(this).show();

							});

						});

					});
					$(document).ready(function () {
						$(".link-detail").on("click", function (e) {
							e.preventDefault();
							$("#modalDetaills").modal("show").find(".modal-content").load($(this).attr("href"));
						});
					});
					$(document).ready(function () {
						$(".link-EmpleadoEdit").on("click", function (e) {
							e.preventDefault();
							$("#modalDetaills").modal("show").find(".modal-content").load($(this).attr("href"));
						});
					});
					$(document).ready(function () {
						$(".link-Download").on("click", function (e) {
							e.preventDefault();
							$("#modalDownload").modal("show").load($(this).attr("href"));
						});
					});
				</script>
				<style>
					.contenedor-tabla {
						height: 400px;
						/* Altura fija para el contenedor */
						overflow-y: auto;
						/* Barra de desplazamiento vertical si el contenido excede la altura */
						overflow-x: auto;
						/* Barra de desplazamiento horizontal si el contenido excede el ancho */
						border: 1px solid #ccc;
						/* Opcional: para visualizar el contenedor */
					}

					/* Para mantener el encabezado fijo */
					.contenedor-tabla table {
						width: 100%;
						/* O un ancho fijo para la tabla */
						border-collapse: collapse;
					}

					.contenedor-tabla thead {
						position: sticky;
						top: 0;
						background-color: #f2f2f2;
						/* Para que no se transparente */
						z-index: 1;
					}

					/* Estilos básicos para celdas (opcional) */
					.contenedor-tabla th,
					.contenedor-tabla td {
						border: 1px solid #ddd;
						padding: 8px;
						text-align: left;
					}
				</style>
				<footer th:replace="layout/layout :: footer"></footer>
			</div><!-- /.container-fluid -->
		</section>
		<!-- /.content -->
	</main> <!--end::App Main--> <!--begin::Footer-->

</div>
<!-- /.content-wrapper -->
<footer th:replace="footerAll :: html_footer" />

</html>
