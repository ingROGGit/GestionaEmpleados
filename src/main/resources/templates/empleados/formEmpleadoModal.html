<style>
	/* Opcional: Elimina los márgenes predeterminados del body para un verdadero ancho completo */
	body {
		margin: 0;
		padding: 0;
		font-family: sans-serif;
	}

	form {
		width: 100%;
		box-sizing: border-box;
		/* Asegura que el padding y el border se incluyan en el 100% */
		padding: 20px;
		/* Ejemplo de padding */
		border: 1px solid #ccc;
		/* Ejemplo de borde */
		background-color: #f9f9f9;
		/* Puedes añadir un max-width si no quieres que sea demasiado ancho en pantallas muy grandes */
		/* max-width: 1200px; */
		margin: 0 auto;
		/* Centra el formulario si usas max-width */
	}

	input[type="text"],
	input[type="submit"] {
		width: 100%;
		box-sizing: border-box;
		padding: 10px;
		margin-bottom: 10px;
	}
</style>
<div class="card bg-light">
	<div class="card-header" th:text="${titulo}">
	</div>
	<div class="card-body">
		<div class="row">
			<div class="col-lg-12 col-md-12 col-sm-12 container justify-content-center card text-center">
				<a>
					<h2><span th:text="${titulo}"></span></h2>
				</a>
			</div>
			<!--								<h1 class="text-center" th:text="${titulo}"></h1>-->
			<form th:action="@{/empleados/formEmpleadoSave}" th:object="${empleado}" method="post">
				<!--				<input type="hidden" th:field="*{id}" th:value="${empleado.id}" />-->
				<input type="hidden" th:field="*{nombreCompleto}" th:value="${empleado.nombreCompleto}" />
				<input type="hidden" th:field="*{plaza}" th:value="${empleado.plaza}" />
				<input type="hidden" th:field="*{claveP}" th:value="${empleado.claveP}" />
				<div class="row">
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
						<label>Numero Empleado: </label>
						<input type="number" th:field="*{id}" class="form-control"
							th:errorClass="'form-control alert-danger'" readonly />
						<th:block sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS')">
							<label>Fecha Ingreso: </label>
							<input type="date" th:field="*{fechaIngreso}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('fechaIngreso')}"
								th:errors="*{fechaIngreso}"></small>
							<label>Fecha Ingreso Hospital: </label>
							<input type="date" th:field="*{fechaIngresoH}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('fechaIngresoH')}"
								th:errors="*{fechaIngresoH}"></small>
							<label>Tipo Contrato: </label>
							<input type="text" th:field="*{tipoContrato}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('tipoContrato')}"
								th:errors="*{tipoContrato}"></small>
						</th:block>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
						<th:block sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS')">
							<label>Nombre: </label>
							<input type="text" th:field="*{nombre}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('nombre')}"
								th:errors="*{nombre}"></small>
						</th:block>
						<label>Sexo: </label>
						<select class="form-control" th:field="*{sexo}">
							<option th:value='M'>Masculino</option>
							<option th:value='F'>Femenino</option>
							<option th:value='Otro'>Otro</option>
						</select>
						<th:block
							sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS','ROLE_OPERADORSINAVID')">
							<label>CURP: </label>
							<input type="text" th:field="*{curp}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}"
								th:errors="*{curp}"></small>
						</th:block>
					</div>

					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
						<th:block
							sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS','ROLE_OPERADORSINAVID')">
							<label>Apellido Paterno: </label>
							<input type="text" th:field="*{apellidop}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('apellidop')}"
								th:errors="*{apellidop}"></small>
						</th:block>
						<label>Correo: </label>
						<input type="text" th:field="*{correo}" class="form-control"
							th:errorClass="'form-control alert-danger'" />
						<small class="form-text text-danger" th:if="${#fields.hasErrors('correo')}"
							th:errors="*{correo}"></small>
						<th:block
							sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS','ROLE_OPERADORSINAVID')">
							<label>RFC: </label>
							<input type="text" th:field="*{rfc}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}"
								th:errors="*{rfc}"></small>
						</th:block>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
						<th:block
							sec:authorize="hasAnyRole('ROLE_ADMIN','ROLE_OPERADOR','ROLE_OPERADORCUENTAS','ROLE_OPERADORSINAVID')">
							<label>Apellido Materno: </label>
							<input type="text" th:field="*{apellidom}" class="form-control"
								th:errorClass="'form-control alert-danger'" />
							<small class="form-text text-danger" th:if="${#fields.hasErrors('apellidom')}"
								th:errors="*{apellidom}"></small>
						</th:block>
						<label>Telefono: </label>
						<input type="number" th:field="*{telefono}" class="form-control"
							th:errorClass="'form-control alert-danger'" />
						<small class="form-text text-danger" th:if="${#fields.hasErrors('telefono')}"
							th:errors="*{telefono}"></small>
						<label>Telefono Emergencia: </label>
						<input type="number" th:field="*{telefonoEmer}" class="form-control"
							th:errorClass="'form-control alert-danger'" />
						<small class="form-text text-danger" th:if="${#fields.hasErrors('telefonoEmer')}"
							th:errors="*{telefonoEmer}"></small>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
						<h4></h4>
					</div>
				</div>
				<div class="row">


					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
					</div>
				</div>
				<div class="row">
					<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
						<h4>
							<p></p>
						</h4>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
					</div>
					<div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
						<div class="box-footer">
							<input type="submit" value="Guardar" class="btn btn-primary">
						</div>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
					</div>
				</div>
			</form>
		</div>
	</div><!-- /.container-fluid -->
</div>
<div class="modal-footer">
	<button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
</div>
