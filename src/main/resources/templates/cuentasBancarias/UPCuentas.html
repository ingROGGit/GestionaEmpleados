<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en"> <!--begin::Head-->

<head th:replace="headAll :: html_head" />

<body th:replace="menu :: menuAll" onload="validaModal()" />
<!-- 1. CSS base de Select2 -->
<link rel="stylesheet" th:href="@{/distV32/plugins/select2/css/select2.min.css}">

<!-- 2. CSS del tema Bootstrap 4 para AdminLTE 3 -->
<link rel="stylesheet" th:href="@{/distV32/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css}">
<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
	<!-- Content Header (Page header) -->
	<div th:replace="div-header :: divHeader" />
	<!-- /.content-header -->

	<!-- Main content -->
	<main class="app-main"> <!--begin::App Content Header-->
		<section class="content">
			<div class="container-fluid">
				<div class="py-4 ml-5 mr-5">
					<div class="carf bg-light">
						<!--								<div class="sidebar-brand"> -->
						<!--									<a href="menu" class="brand-link"> -->
						<!--										<span class="brand-text fw-light" th:text="${titulo}"></span>-->
						<!--								</div> -->
						<div class="card-body col-lg-12 col-md-12 col-sm-12 col-xs-12">
							<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
							<link rel="stylesheet"
								href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
								integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
								crossorigin="anonymous">
							<!--							<div th:if="${!fileExDownload}" class="alert alert-primary alert-dismissible fade show"-->
							<!--								role="alert">-->
							<!--								<span aria-hidden="true">&times;</span>-->
							<!--								<button type="button" class="close" data-dismiss="alert" aria-label="Close">-->
							<!--									<span aria-hidden="true"-->
							<!--										th:text="${'El reporte se encuentra en proceso de Generacion o ya fue descargado'}">&times;</span>-->
							<!--								</button>-->
							<!--							</div>-->
							<form th:action="@{/cuentasBancarias/WriteFile}" th:object="${alta}" method="post">
								<div class="row">
									<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
										<label>Quincena: </label>
										<select class="form-control select2" id="quinCatSelect" name="quinCatSelect"
											style="width: 100%;" required>
											<option value="">select QNA</option>
											<option th:each="qna : ${LquincenasCat}" th:value="${qna}" th:text="${qna}"
											th:selected="${qna == quinCatSelect}">
											</option>
										</select>
									</div>
									<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
										Alta: <input id="alta" name="alta" class="list-group-item"
											th:value="${alta}"></input>
									</div>
									<div class="row">
										<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
											<h4></h4>
										</div>
									</div>
								</div>
								<div class="row">
									<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
										<h4></h4>
									</div>
								</div>
								<div class="row">
									<div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
										<h4>
											<p></p>
										</h4>
									</div>
								</div>
								<div class="row">
									<div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
										<h2>
<!--									<input class="form-control" id="search" type="text" placeholder="Buscar..">-->
									Total Registros:<a class="btn btn-info" th:text="${registros}"></a>

								</h2>
									</div>
									<div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
										<div class="box-footer">
											<input type="submit" value="Generar Excel" class="btn btn-primary">
										</div>
									</div>
									<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
									</div>
								</div>
							</form>
							<div class="contenedor-tabla">
								<table id="EmTable" class="table table-striped">
									<!--							<table id="EmTable"	class="table table-striped table-bordered" style="width:100%">-->
									<thead>
										<tr>
											<th>Numero</th>
											<th>Nombre</th>
											<th>Cuenta</th>
											<th>Banco</th>
											<th class="col-lg-2 col-md-2 col-sm-2 col-xs-12">Fecha Ingreso</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="empleado : ${empleados}">
											<td th:text="${empleado.id}"></td>
											<td th:text="${empleado.nombreCompleto}"></td>
											<td th:text="${empleado.LCuentas[0].cuenta}"></td>
											<td class="col-lg-3 col-md-3 col-sm-6 col-xs-12"
												th:text="${not #lists.isEmpty(empleado.LCuentas)} ? ${empleado.LCuentas[0].bancoE.banco} : 'Sin cuenta asignada'">
												></td>
											<td class="col-lg-2 col-md-2 col-sm-2 col-xs-12"
												th:text="${empleado.fechaIngreso}"></td>
										</tr>
									</tbody>
								</table>
							</div>
							<nav th:replace="paginator-nav :: paginator"></nav>
						</div>
					</div>
					<div id="modalDetaills" class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog"
						aria-labelledby="myExtraLargeModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-xl" role="document">
							<div class="modal-content">
							</div>
						</div>
					</div>
					<div id="modalDownload" class="modal fade bd-example-modal-xl" tabindex="-1" role="dialog"
						aria-labelledby="myExtraLargeModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-xl" role="document">
							<div class="modal-content">
								<div class="modal-content">
									<div class="modal-header">
										<h5 class="modal-title" id="exampleModalLabel">Descarga de Reportes</h5>
										<button type="button" class="btn-close" data-bs-dismiss="modal"
											aria-label="Close"></button>
									</div>
									<div class="modal-body">
										<span aria-hidden="true">&times;</span>
										<button type="button" class="close" data-dismiss="alert" aria-label="Close">
											<span aria-hidden="true" th:text="${'El Reporte se esta ejecutando en segundo plano Favor de esperar unos minutos y
										dar clic en  Descargar Reporte'}">&times;</span>
										</button>

									</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary"
											data-dismiss="modal">Close</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!-- 1. Carga de librerías (Asegúrate de que jQuery se cargue ANTES de esto) -->
				<script th:src="@{/distV32/plugins/select2/js/select2.full.min.js}"></script>
				<script th:src="@{/distV32/js/pages/dashboard.js}"></script>

				<!-- 2. Inicialización del componente -->
				<script>
					$(document).ready(function () {
						$('#quinCatSelect').select2({
							theme: 'bootstrap4',
							placeholder: 'select QNA',
							allowClear: true
						});
					});
				</script>
				<script>
					$(document).ready(function () {

						$("#search").keyup(function () {

							_this = this;
							$.each($("#EmTable tbody tr"), function () {

								if ($(this).text().toLowerCase().indexOf($(_this).val().toLowerCase()) === -1)

									$(this).hide();

								else

									$(this).show();

							});

						});

					});
					$(document).ready(function () {
						$(".link-detail").on("click", function (e) {
							e.preventDefault();
							$("#modalDetaills").modal("show").find(".modal-content").load($(this).attr("href"));
						});
					});
					$(document).ready(function () {
						$(".link-EmpleadoEdit").on("click", function (e) {
							e.preventDefault();
							$("#modalDetaills").modal("show").find(".modal-content").load($(this).attr("href"));
						});
					});
					$(document).ready(function () {
						$(".link-Download").on("click", function (e) {
							e.preventDefault();
							$("#modalDownload").modal("show").load($(this).attr("href"));
						});
					});
				</script>
				<style>
					.contenedor-tabla {
						height: 400px;
						/* Altura fija para el contenedor */
						overflow-y: auto;
						/* Barra de desplazamiento vertical si el contenido excede la altura */
						overflow-x: auto;
						/* Barra de desplazamiento horizontal si el contenido excede el ancho */
						border: 1px solid #ccc;
						/* Opcional: para visualizar el contenedor */
					}

					/* Para mantener el encabezado fijo */
					.contenedor-tabla table {
						width: 100%;
						/* O un ancho fijo para la tabla */
						border-collapse: collapse;
					}

					.contenedor-tabla thead {
						position: sticky;
						top: 0;
						background-color: #f2f2f2;
						/* Para que no se transparente */
						z-index: 1;
					}

					/* Estilos básicos para celdas (opcional) */
					.contenedor-tabla th,
					.contenedor-tabla td {
						border: 1px solid #ddd;
						padding: 8px;
						text-align: left;
					}
				</style>
				<footer th:replace="layout/layout :: footer"></footer>
			</div><!-- /.container-fluid -->
		</section>
		<!-- /.content -->
	</main> <!--end::App Main--> <!--begin::Footer-->

</div>
<!-- /.content-wrapper -->

</html>
