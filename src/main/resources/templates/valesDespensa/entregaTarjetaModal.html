	<div class="col-lg-12 col-md-12 col-sm-12 container justify-content-center card text-center">
		<a>
			<h2><span th:text="${titulo}"></span></h2>
		</a>
	</div>
	<div class="card-body">
		<form th:action="@{/ValesDespensa/entregarTarjeta}" th:object="${valeDespensa}" method="post">
			<input type="hidden" th:field="*{id}" />
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
					Numero Empleado: <li class="list-group-item" th:text="${valeDespensa.empleado.id}"></li>
					</li>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
					Nombre: <li class="list-group-item" th:text="${valeDespensa.empleado.nombreCompleto}"></li>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
					Tarjeta:<input id="tarjeta" class="list-group-item" th:field="*{folio}" th:value="${valeDespensa.folio}"
						readonly></input>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-6 col-xs-12">
					<label>Escaneo:</label>
					<input id="scanerInput" type="text" class="form-control" th:field="${valeDespensa.scaner}" />
				</div>
			</div>
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
				</div>
				<div class="col-lg-6 col-md-6 col-sm-6 col-xs-6">
					<div class="box-footer">
						<input type="submit" value="Guardar" class="btn btn-primary" onclick="validaTarjeta();">
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 col-xs-3">
				</div>
			</div>
		</form>
	</div>
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
	</div>
	<script>
		function validaTarjeta(){
			const input1 = document.getElementById('tarjeta').value;
			const input2 = document.getElementById('scanerInput').value;

			// 2. Comparar si son diferentes
			if (input1 !== input2) {
				// 3. Detener el envío del formulario
				event.preventDefault();

				// 4. Mostrar la alerta al usuario
				alert('La tarjeta no coinciden. Por favor, verifícalos.');
				}
		}
	</script>
